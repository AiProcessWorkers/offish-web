<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Offish</title>
    <style>
      /* Offish 웹 템플릿: 브라우저 창 전체를 게임 화면으로 쓴다 (도트 배율은 게임이 화면 크기에 맞춰 정수로 정한다) */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #08234D; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #08234D; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 14px; color: #FFE066; font: bold 20px/1 monospace; letter-spacing: 2px; }
      #bar { width: 220px; height: 10px; border: 2px solid #FFE066; box-sizing: border-box; }
      #fill { width: 0; height: 100%; background: #FFE066; }
      #rotate { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; text-align: center;
                background: #08234D; color: #F6F9FF; font: 16px/1.6 sans-serif; padding: 24px; box-sizing: border-box; }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">OFFISH<div id="bar"><div id="fill"></div></div></div>
    <div id="rotate">가로 화면 게임이에요.<br>휴대폰을 가로로 돌려 주세요.</div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "AiProcessWorkers",
        productName: "Offish",
        productVersion: "1.0",
      }, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
